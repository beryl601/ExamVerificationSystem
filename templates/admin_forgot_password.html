{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
  <div class="col-md-7 col-lg-5">
    <div class="card login-card">
      <div class="text-center mb-4">
        <div class="page-title">Reset Admin Password</div>
        <div class="page-subtitle">Answer the security question to reset your password.</div>
      </div>

      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      {% if success %}
      <div class="alert alert-success">{{ success }}</div>
      {% endif %}

      <form method="POST" class="mx-2">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input id="username" name="username" type="text" class="form-control" placeholder="Enter your username" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label" for="security_answer">Security Question: What is the name of this exam system?</label>
          <input id="security_answer" name="security_answer" type="text" class="form-control" placeholder="Answer: Pwani" required>
          <small class="text-muted">Hint: It's the institution name</small>
        </div>

        <div class="mb-4">
          <label class="form-label" for="new_password">New Password</label>
          <input id="new_password" name="new_password" type="password" class="form-control" placeholder="Enter at least 6 characters" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('admin_login') }}" class="text-decoration-none">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
