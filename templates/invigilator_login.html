{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
  <div class="col-md-7 col-lg-5">
    <div class="card login-card">
      <div class="text-center mb-4">
        <div class="page-title">Invigilator Login</div>
        <div class="page-subtitle">Authorized invigilators can sign in to review attendance and verification status.</div>
      </div>

      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="POST" class="mx-2">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input id="username" name="username" type="text" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

    </div>
  </div>
</div>
{% endblock %}
