{% extends "base.html" %}
{% block content %}
<p class="page-title">Student Registered Successfully</p>
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <!-- Student name and details -->
      <h5 class="fw-bold mb-1">{{ student.full_name }}</h5>
      <p class="text-muted mb-1">{{ student.reg_number }}</p>
      <p class="text-muted mb-3">{{ student.course }}</p>
      <!-- QR code image -->
      <img src="/{{ student.qr_code_path }}"
           alt="Student QR Code"
           style="width: 200px; height: 200px;
                  border: 4px solid #0d2c6e;
                  border-radius: 12px;">
      <p class="mt-3 small text-muted">
          The student should save or print this QR code.
          It is their exam entry pass.
      </p>
      <!-- Action buttons -->
      <div class="d-grid gap-2 mt-3">
        <a href="/register" class="btn btn-primary">
            Register Another Student
        </a>
        <a href="/students" class="btn btn-outline-secondary">
            View All Students
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
